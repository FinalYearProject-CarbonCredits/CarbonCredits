<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CarbonChain — Login</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">

  <link rel="stylesheet" href="css/auth.css">

</head>

<body>

  <div id="toast"></div>

  <div class="auth-page">

    <div class="auth-card">

      <div class="auth-title">CARBON<span style="color:var(--green)">CHAIN</span></div>

      <div class="auth-sub">// SECURE PORTAL LOGIN</div>



      <div class="form-group">

        <label class="form-label">Email</label>

        <input class="form-input" id="login-email" type="email" placeholder="you@example.com" autocomplete="username">

      </div>

      <div class="form-group">

        <label class="form-label">Password</label>

        <input class="form-input" id="login-password" type="password" placeholder="••••••••" autocomplete="current-password">

      </div>

      <button class="btn btn-green btn-full" id="btn-login" type="button">Sign In</button>

      <div id="login-status" style="font-family:var(--mono);font-size:11px;color:var(--text3);margin-top:10px;min-height:16px;"></div>



      <div class="auth-demo">

        <strong>Demo accounts</strong><br>

        Admin: admin@carbonchain.in / admin123<br>

        Landowner: landowner@example.com / user123<br>

        Company: company@example.com / company123<br><br>

        <a href="index.html" style="color:var(--green);">→ Public demo dashboard</a>

      </div>

    </div>

  </div>

  <script src="js/config.js"></script>

  <script src="js/auth.js"></script>

  <script>

    const user = getUser();

    if (user && getToken()) window.location.href = portalForRole(user.role);



    async function doLogin() {

      const btn = document.getElementById('btn-login');

      const status = document.getElementById('login-status');

      const email = document.getElementById('login-email').value.trim();

      const password = document.getElementById('login-password').value;

      if (!email || !password) return toast('Enter email and password');



      btn.disabled = true;

      btn.textContent = 'Signing in...';

      status.textContent = `Connecting to ${window.BACKEND}...`;



      try {

        const res = await fetch(`${window.API}/auth/login`, {

          method: 'POST',

          headers: { 'Content-Type': 'application/json' },

          body: JSON.stringify({ email, password }),

        });

        let data;

        try {

          data = await res.json();

        } catch {

          throw new Error(`Invalid response from server (${res.status})`);

        }

        if (!res.ok) throw new Error(apiErrorMessage(data, 'Login failed'));

        saveSession(data.access_token, { role: data.role, full_name: data.full_name, user_id: data.user_id, email }, data.refresh_token);

        status.textContent = 'Success — redirecting...';

        window.location.href = portalForRole(data.role);

      } catch (e) {

        const msg = e.message === 'Failed to fetch' ? backendUnreachableMessage() : e.message;

        status.textContent = '';

        toast(msg);

      } finally {

        btn.disabled = false;

        btn.textContent = 'Sign In';

      }

    }



    document.getElementById('btn-login').addEventListener('click', doLogin);

    document.getElementById('login-password').addEventListener('keydown', e => {

      if (e.key === 'Enter') doLogin();

    });

    document.getElementById('login-email').addEventListener('keydown', e => {

      if (e.key === 'Enter') doLogin();

    });

  </script>

</body>

</html>
